name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS v1.0.3
        run: |
          mkdir -p rgbds-bin
          curl -sL https://github.com/gbdev/rgbds/releases/download/v1.0.3/rgbds-linux-x86_64.tar.xz | tar -xJ -C rgbds-bin

      - name: Build ROM
        run: make RGBDS="$PWD/rgbds-bin/"

      - name: Stage site
        run: |
          mkdir -p _site
          cp web/* _site/
          cp pirates_folly.gb _site/

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) on first run
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
